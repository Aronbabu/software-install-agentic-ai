services:
  postgres-local:
    image: pgvector/pgvector:pg16
    container_name: software-install-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: software_install
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata
    ports:
      - "5433:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data

  redis-local:
    image: redis:7
    container_name: software-install-redis-local
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata_local:/data
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Kolkata

volumes:
  pgdata_local:
  redisdata_local: