services:
  postgres:
    image: postgres:16
    container_name: software-install-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: software_install
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: software-install-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Kolkata

  api:
    build: .
    container_name: software-install-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: software_install
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TZ: Asia/Kolkata


  celery-worker:
    build: .
    container_name: software-install-worker
    command: celery -A app.celery_app:celery_app worker --loglevel=info -E
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: software_install
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SSH_USERNAME: root
      SSH_PASSWORD: root
      SSH_PORT: 2222
      TZ: Asia/Kolkata



  flower:
    image: mher/flower
    container_name: software-install-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    command: celery --broker=redis://redis:6379/0 flower
    depends_on:
      - redis
      - celery-worker
    environment:
      TZ: Asia/Kolkata

volumes:
  pgdata:
  redisdata: