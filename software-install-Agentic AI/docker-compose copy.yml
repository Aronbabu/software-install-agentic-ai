version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: software-install-postgres
    environment:
      POSTGRES_DB: software_install
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7

  api:
    build: .
    depends_on:
      - postgres
      - redis

  celery-worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres

  flower:
    image: mher/flower
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
volumes:
  pgdata:
  